<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 4</title>
</head>
<body>
    <header>
           <h3>Formulario para la UTN</h3>
            <img src="imagen.webp" alt="">
        <nav>
            <ul>
                <li><a href="#formulario">Ir al formulario</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Formulario</h2>
       <section id="formulario">
            <article>
                <form>
                    <input type="text" placeholder="Ingrese su Nombre" required pattern="[A-Za-z]+"  title="Solo letras,sin caracteres especiales ni numeros">
                    <input type="email" placeholder="Ingrese su Email" required>
                    <label for="fecha">Fecha de nacimiento</label>
                    <input type="date" required id="fecha" name="fecha">
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo">
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>
                    <div>
                        <fieldset>
                            <legend>Comida preferida</legend>
                            <input type="radio" name="comida" id="carne">
                            <label for="carne">Carne</label>
                            <input type="radio" name="comida" id="pastas">
                            <label for="pastas">Pastas</label>
                            <input type="radio" name="comida" id="verduras">
                            <label for="verduras">Verduras</label>
                        </fieldset>
                    </div>
                    <h3>Ingrese una breve descripcion suya</h3>
                    <textarea placeholder="Ingrese breve descripcion "></textarea>
                    <div>
                        <button>Enviar</button>
                    </div>
                
                    </form>

            </article>
          

       </section>


    </main>  
    
    <footer>

    </footer>  
</body>
</html>
